# Publishes sdist + wheel to TestPyPI on every `v*` tag.
#
# One-time setup (trusted publishing, no API tokens):
#   1. Sign in at https://test.pypi.org
#   2. Account settings -> "Add a new pending publisher"
#      - PyPI project name: fast-ccsds-parser
#      - Owner: daikiito-dk
#      - Repository: fast-ccsds-parser
#      - Workflow name: publish-testpypi.yml
#      - Environment: leave empty
#   3. Push a tag: git tag v0.1.0 && git push origin v0.1.0

name: Publish to TestPyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
