# Publishes sdist + wheel to PyPI on every `v*` tag (or a manual run).
#
# The file keeps its historical name because the PyPI trusted publisher is
# registered against "publish-testpypi.yml"; renaming it breaks publishing
# until the publisher on pypi.org is updated to the new name.
#
# One-time setup (trusted publishing, no API tokens):
#   1. Sign in at https://pypi.org
#   2. Account settings -> Publishing -> "Add a new pending publisher"
#      - PyPI project name: fast-ccsds-parser
#      - Owner: daikiito-dk
#      - Repository: fast-ccsds-parser
#      - Workflow name: publish-testpypi.yml
#      - Environment: leave empty
#   3. Bump __version__, then push a tag: git tag vX.Y.Z && git push origin vX.Y.Z

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
