name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} (all extras)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package, optional extras, and dev tools
        run: python -m pip install -e ".[dev,all]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=fast_ccsds_parser --cov-report=term-missing

  core-only:
    name: Python 3.10 (no optional dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package and pytest only
        run: python -m pip install -e . pytest
      - name: Check that no optional dependency is installed
        run: |
          python - <<'EOF'
          import importlib.util
          present = [m for m in ("pyarrow", "polars", "pandas") if importlib.util.find_spec(m)]
          assert not present, f"unexpected optional dependencies: {present}"
          EOF
      - name: Test
        run: pytest
